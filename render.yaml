services:
  - type: web
    name: death-terminal
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: PORT
        value: 8080
      # set these in the render dashboard:
      # - key: NGROK_AUTHTOKEN     (required)
      # - key: NGROK_TCP_ADDR      (optional, e.g. "1.tcp.ngrok.io:12345")
      # - key: SSH_ROOT_PASSWORD   (recommended)
      # - key: SSH_PUBKEY          (optional, key-based login)
      # - key: AUTORUN             (optional, "1" to auto-launch officialv3.py on login)
    autoDeploy: true
